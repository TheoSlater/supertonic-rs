[package]
name = "supertonic-model-store"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model downloading, caching, and verification for Supertonic TTS"
keywords = ["tts", "text-to-speech", "supertonic", "model", "huggingface"]
categories = ["multimedia::audio"]

[dependencies]
supertonic-core = { path = "../core", version = "0.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util"] }
tokio-stream = "0.1"
anyhow = "1.0"
thiserror = "2"
tracing = "0.1"
