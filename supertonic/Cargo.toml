[package]
name = "st-tts"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-level on-device TTS via Supertonic — one-liner synthesize, auto-download models"
keywords = ["tts", "text-to-speech", "supertonic", "audio", "speech-synthesis"]
categories = ["multimedia::audio"]

[dependencies]
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
unicode-normalization = "0.1"
hound = "3.5"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tokio-stream = "0.1"
dirs = "5"

[build-dependencies]
ureq = { version = "3", features = ["rustls"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
