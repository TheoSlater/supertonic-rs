[package]
name = "supertonic-ort-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "ONNX Runtime backend for Supertonic TTS — loads and runs 4 ONNX sessions"
keywords = ["tts", "text-to-speech", "supertonic", "onnx", "ort"]
categories = ["multimedia::audio", "science::speech"]

[dependencies]
supertonic-core = { path = "../core" }
ort = { version = "2.0.0-rc.12", features = ["load-dynamic"] }
ndarray = "0.17"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"

[build-dependencies]
ureq = { version = "3", features = ["rustls"], default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
