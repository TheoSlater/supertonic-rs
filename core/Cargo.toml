[package]
name = "supertonic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Engine-agnostic TTS pipeline for Supertonic — text processing, audio encoding, style loading"
keywords = ["tts", "text-to-speech", "supertonic", "audio", "speech"]
categories = ["multimedia::audio"]

[dependencies]
ndarray = { version = "0.17", features = ["rayon"] }
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
unicode-normalization = "0.1"
hound = "3.5"
anyhow = "1.0"
thiserror = "2"
async-trait = "0.1"
